[project]
name = "mailroom"
version = "0.1.0"
description = "Receive SMS on several SIMs through USB modems; read and forward them remotely."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
